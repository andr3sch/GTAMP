name: Anunciar Release no Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release para anunciar (vazio = ultima release)"
        required: false
        default: ""

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar Embed da Release para o Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Erro: configure o secret DISCORD_WEBHOOK_URL nas configuracoes do repositorio."
            exit 1
          fi

          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -n "$TAG" ]; then
            API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          else
            API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          fi

          RELEASE_JSON=$(curl -sSf -H "Authorization: Bearer $GITHUB_TOKEN" "$API_URL")

          python3 - << 'PY' "$RELEASE_JSON" "$WEBHOOK_URL" "$GITHUB_REPOSITORY"
          import json, sys, urllib.request

          rel = json.loads(sys.argv[1])
          webhook = sys.argv[2]
          repo = sys.argv[3]

          tag = rel.get("tag_name", "v1.0.0")
          name = rel.get("name") or f"GTAMP {tag}"
          body = (rel.get("body") or "Nova atualizacao disponivel!").strip()
          if len(body) > 1800:
              body = body[:1797] + "..."
          html_url = rel.get("html_url", f"https://github.com/{repo}/releases/latest")

          assets = rel.get("assets", [])
          downloads = "\n".join(
              f"📦 **[{a['name']}]({a['browser_download_url']})** ({a['size'] / 1048576:.2f} MB)"
              for a in assets
          ) or f"🔗 [Abrir página de downloads]({html_url})"

          avatar = f"https://raw.githubusercontent.com/{repo}/main/docs/assets/gtamp-logo.png"

          payload = {
              "username": "GTAMP Releases",
              "avatar_url": avatar,
              "content": f"🚀 **Nova atualização do GTAMP disponível (`{tag}`)!**",
              "embeds": [
                  {
                      "title": name,
                      "url": html_url,
                      "description": body,
                      "color": 3066993,
                      "thumbnail": {"url": avatar},
                      "fields": [
                          {
                              "name": "⬇️ Downloads Diretos",
                              "value": downloads,
                              "inline": False
                          },
                          {
                              "name": "⚙️ Requisito",
                              "value": "[.NET 8 Desktop Runtime (x64)](https://dotnet.microsoft.com/en-us/download/dotnet/8.0)",
                              "inline": True
                          },
                          {
                              "name": "📖 Repositório",
                              "value": f"[GitHub {repo}](https://github.com/{repo})",
                              "inline": True
                          }
                      ],
                      "footer": {
                          "text": "GTAMP • GTA V Lighter 1.0.463.1 • 100% Gratuito & Open-Source"
                      }
                  }
              ]
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GTAMP-Release-Bot/1.0"
              },
              method="POST"
          )
          with urllib.request.urlopen(req) as resp:
              print("Discord respondeu:", resp.status)
          PY
